name: Publish release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify tag matches integration version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import ast
          import json
          import os
          import tomllib
          from pathlib import Path

          manifest = json.loads(
              Path("custom_components/homepass/manifest.json").read_text(encoding="utf-8")
          )
          constants = ast.parse(
              Path("custom_components/homepass/const.py").read_text(encoding="utf-8")
          )
          internal_version = next(
              ast.literal_eval(node.value)
              for node in constants.body
              if isinstance(node, ast.AnnAssign)
              and isinstance(node.target, ast.Name)
              and node.target.id == "VERSION"
          )
          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          if internal_version != manifest["version"] or project["project"]["version"] != manifest["version"]:
              raise SystemExit("Internal, manifest and project versions must match")
          expected = f"v{manifest['version']}"
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              raise SystemExit(
                  f"Release tag {actual!r} does not match manifest version {expected!r}"
              )
          PY

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "HomePASS ${RELEASE_TAG#v}" \
              --generate-notes
          fi
