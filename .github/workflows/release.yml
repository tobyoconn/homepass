name: Publish release

on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read
  pull-requests: read

jobs:
  validation:
    name: Validate tagged source
    uses: ./.github/workflows/validate.yml

  security:
    name: Check tagged source security
    uses: ./.github/workflows/security.yml

  release:
    name: Publish GitHub release
    needs: [validation, security]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify release version
        id: version
        env:
          PUSHED_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          python - <<'PY'
          import ast
          import json
          import os
          import re
          import tomllib
          from pathlib import Path

          manifest = json.loads(
              Path("custom_components/homepass/manifest.json").read_text(encoding="utf-8")
          )
          constants = ast.parse(
              Path("custom_components/homepass/const.py").read_text(encoding="utf-8")
          )
          internal_version = next(
              ast.literal_eval(node.value)
              for node in constants.body
              if isinstance(node, ast.AnnAssign)
              and isinstance(node.target, ast.Name)
              and node.target.id == "VERSION"
          )
          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          if internal_version != manifest["version"] or project["project"]["version"] != manifest["version"]:
              raise SystemExit("Internal, manifest and project versions must match")
          expected = f"v{manifest['version']}"
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", expected):
              raise SystemExit(f"Invalid stable release version: {expected!r}")
          actual = os.environ["PUSHED_TAG"]
          if actual and actual != expected:
              raise SystemExit(
                  f"Release tag {actual!r} does not match manifest version {expected!r}"
              )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"tag={expected}\n")
          PY

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
          else
            if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
              gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
                -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$RELEASE_SHA" >/dev/null
            fi
            tagged_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)"
            if [ "$tagged_sha" != "$RELEASE_SHA" ]; then
              echo "Refusing to publish: tag points to a different, unvalidated commit."
              exit 1
            fi
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "HomePASS ${RELEASE_TAG#v}" \
              --generate-notes
          fi
