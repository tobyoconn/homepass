name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  compatibility:
    name: Home Assistant ${{ matrix.channel }} startup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, beta]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Boot HomePASS with current Home Assistant and real dependency constraints
        env:
          HA_CHANNEL: ${{ matrix.channel }}
        run: |
          docker run --rm --pull always \
            --entrypoint python \
            -v "$PWD:/work:ro" -w /work \
            "ghcr.io/home-assistant/home-assistant:$HA_CHANNEL" \
            scripts/check_ha_compatibility.py

  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install validation dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run frontend behaviour tests
        run: node --test tests/frontend/*.test.cjs
      - name: Run tests
        run: pytest

  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install Ruff
        run: python -m pip install ruff==0.15.20
      - name: Run Ruff lint
        run: ruff check .
      - name: Check Python formatting
        run: ruff format --check .

  mypy:
    name: Mypy
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install validation dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Run strict mypy ratchet
        run: >-
          mypy --explicit-package-bases
          custom_components/homepass/vault
          custom_components/homepass/models/authorization.py
          custom_components/homepass/services/authorization.py
          custom_components/homepass/models/schedule.py
          custom_components/homepass/services/schedule.py

  validate-hacs:
    name: HACS
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate HACS repository
        uses: hacs/action@main
        with:
          category: integration

  validate-hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate Home Assistant integration
        uses: home-assistant/actions/hassfest@master
