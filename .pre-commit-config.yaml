repos:
  - repo: local
    hooks:
      - id: homepass-privacy
        name: HomePASS repository privacy check
        entry: python3 scripts/check_repository_privacy.py
        language: system
        pass_filenames: false

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
