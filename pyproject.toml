[project]
name = "homepass"
version = "1.17.4"
description = "People-first access management for Home Assistant"
requires-python = ">=3.14"
license = {text = "MIT"}
authors = [{name = "HomePASS contributors"}]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
# Start the mandatory CI gate with correctness-critical rules. The documented
# legacy style baseline is remediated separately before broader rules are enabled.
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pyNukiBT", "pyNukiBT.*", "pytest_homeassistant_custom_component.*"]
ignore_missing_imports = true
